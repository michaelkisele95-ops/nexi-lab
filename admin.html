<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexi Lab — Administration</title>
<meta name="theme-color" content="#0a1628">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="molecule-bg"></div>
<div class="app-shell">
  <div class="topbar">
    <img src="icons/logo-nexilab.svg" class="logo" alt="">
    <span class="title">Nexi Lab · Admin</span>
    <button class="btn btn-ghost btn-sm" id="btnLogoutAdmin" style="width:auto;margin-left:auto;">⏻ Quitter</button>
  </div>

  <div class="stack">
    <section class="screen" data-screen="nexians"><h2>Nexians</h2><div id="nexiansContent"></div></section>
    <section class="screen" data-screen="donjons" hidden><h2>Donjons</h2><div id="donjonsAdminContent"></div></section>
    <section class="screen" data-screen="nexify" hidden><h2>Nexify</h2><div id="nexifyAdminContent"></div></section>
    <section class="screen" data-screen="cartes" hidden><h2>Cartes de révision</h2><div id="cartesAdminContent"></div></section>
    <section class="screen" data-screen="savais" hidden><h2>Le saviez-vous</h2><div id="savaisAdminContent"></div></section>
    <section class="screen" data-screen="classement" hidden><h2>Classement</h2><div id="classementAdminContent"></div></section>
    <section class="screen" data-screen="stats" hidden><h2>Statistiques</h2><div id="statsContent"></div></section>
    <section class="screen" data-screen="reglages" hidden>
      <h2>Réglages</h2>
      <div class="card">
        <div class="field"><label>Ancien mot de passe</label><input id="oldPwd" type="password"></div>
        <div class="field"><label>Nouveau mot de passe</label><input id="newPwd" type="password"></div>
        <button class="btn btn-primary" id="savePwd">Changer le mot de passe</button>
      </div>
    </section>
  </div>

  <nav class="tabbar">
    <button data-target="nexians" class="active">Nexians</button>
    <button data-target="donjons">Donjons</button>
    <button data-target="nexify">Nexify</button>
    <button data-target="cartes">Cartes</button>
    <button data-target="savais">Faits</button>
    <button data-target="classement">Classt.</button>
    <button data-target="stats">Stats</button>
    <button data-target="reglages">Réglages</button>
  </nav>
</div>

<script src="js/config.js"></script>
<script src="js/logic-core.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
